<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery | A.G. Associates</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet"></head><body><div id="site-header"></div><main><section class="page-hero" style="background-image:url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1800&q=85')"><div class="container"><span class="eyebrow light-eyebrow">Visual stories</span><h1>Ideas, materials, moments.</h1><p>A closer look at our design inspirations, projects and making process.</p></div></section><section class="section-pad"><div class="container"><div class="filter-row"><button class="filter-btn active" data-gallery-filter="All">All</button><button class="filter-btn" data-gallery-filter="Masonry">Masonry</button><button class="filter-btn" data-gallery-filter="Architecture">Architecture</button><button class="filter-btn" data-gallery-filter="Interior">Interior</button><button class="filter-btn" data-gallery-filter="Exterior">Exterior</button><button class="filter-btn" data-gallery-filter="Floor Plans">Floor Plans</button><button class="filter-btn" data-gallery-filter="3D Models">3D Models</button><button class="filter-btn" data-gallery-filter="Construction">Construction</button></div><div class="row g-3" id="galleryGrid"></div></div></section></main><div id="imageViewer" class="modal modal-viewer fade" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-xl"><div class="modal-content position-relative"><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button><img src="" alt=""><p class= const galleryItems=[
["Architecture","photo-1487958449943-2429e8be8625"],["Interior","photo-1600210492486-724fe5c67fb0"],["Exterior","photo-1600607687939-ce8a6c25118c"],["Masonry","photo-1600566753086-00f18fb6b3ea"],["Floor Plans","photo-1600607687644-c7171b42498f"],["3D Models","photo-1600607687920-4e2a09cf159d"],["Construction","photo-1486406146926-c627a92ad1ab"],["Interior","photo-1600607687939-ce8a6c25118c"],["Exterior","photo-1613977257363-707ba9348227"],["Masonry","photo-1600566753190-17f0baa2a6c3"],["Architecture","photo-1600607687920-4e2a09cf159d"],["Floor Plans","photo-1600210492486-724fe5c67fb0"]
];
document.getElementById("galleryGrid").innerHTML=galleryItems.map(([category,image])=>{const url=`https://images.unsplash.com/${image}?auto=format&fit=crop&w=950&q=85`;return `<div class="col-sm-6 col-lg-4 gallery-item" data-category="${category}"><div class="gallery-tile" data-view-image="${url}" data-title="${category}"><img loading="lazy" src="${url}" alt="${category} inspiration"><span>${category}</span></div></div>`}).join("");

</script></body></html>
